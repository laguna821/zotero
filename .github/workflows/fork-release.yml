name: Achmage Edition release
# Builds the Windows, macOS, and Linux packages on request (Actions → Achmage Edition release →
# Run workflow) and attaches them to a draft release
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms (w=Windows, m=macOS, l=Linux)'
        default: 'wml'
      draft_release:
        description: 'Create a draft release with the packages'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip rsync xz-utils
          # Optional: lets fork_build put the Achmage icon on zotero.exe
          sudo apt-get install -y --no-install-recommends wine64 || true
          mkdir -p "$HOME/.local/bin" /tmp/tools
          # 7-Zip 22+ reads the Firefox disk image for macOS (Ubuntu's p7zip is too old)
          curl -fsSL -o /tmp/tools/7z.tar.xz https://github.com/ip7z/7zip/releases/download/26.05/7z2605-linux-x64.tar.xz
          tar -xJf /tmp/tools/7z.tar.xz -C /tmp/tools
          cp /tmp/tools/7zz "$HOME/.local/bin/7z"
          # rcodesign signs the macOS app ad hoc, which Apple Silicon requires
          curl -fsSL -o /tmp/tools/rcodesign.tar.gz https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/tools/rcodesign.tar.gz -C /tmp/tools
          cp /tmp/tools/apple-codesign-0.29.0-x86_64-unknown-linux-musl/rcodesign "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Node modules
        run: npm ci

      - name: Build packages
        run: app/scripts/fork_build -p "${{ inputs.platforms }}"
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - uses: actions/upload-artifact@v4
        with:
          name: achmage-edition
          path: app/dist/*
          if-no-files-found: error

      - name: Create draft release
        if: ${{ inputs.draft_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(ls app/dist | sed -n 's/^SHA256SUMS-//p')
          gh release create "v${version}" app/dist/* \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Zotero ${version} (Achmage Edition)" \
            --notes-file docs/release-notes.md
